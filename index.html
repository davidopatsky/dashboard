<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Výkon obchodníků · Pro vedení</title>
<style>
  body { margin: 0; background: #FFFFFF; color: #111827; font-family: Arial, Helvetica, sans-serif; font-size: 10pt; }
  .lista { position: sticky; top: 0; z-index: 10; background: #FFFFFF; border-bottom: 1px solid #D1D5DB;
           display: flex; align-items: center; gap: 12px; padding: 8px 16px; flex-wrap: wrap; }
  .lista h1 { margin: 0; font-size: 16pt; color: #1F4E78; font-weight: bold; }
  .lista .stav { color: #6B7280; font-size: 10pt; }
  .lista button { margin-left: auto; font: inherit; font-weight: bold; color: #1F4E78; background: #DDE4EE;
                  border: 1px solid #B7C4D6; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  main { padding: 12px 16px 40px; overflow-x: auto; }
  .sekce { font-size: 10pt; font-weight: bold; color: #2F5597; margin: 18px 0 6px; white-space: nowrap; }
  .radaA { display: flex; gap: 0; align-items: flex-start; }
  table.t { border-collapse: collapse; table-layout: fixed; }
  table.t td { border: 1px solid #D1D5DB; padding: 2px 5px; height: 21px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.grp { color: #FFFFFF; font-weight: bold; font-size: 9pt; text-align: center; }
  td.hA { background: #DDE4EE; color: #1F4E78; font-weight: bold; text-align: center; white-space: normal !important; height: 32px !important; line-height: 1.15; }
  td.hM { background: #1F4E78; color: #FFFFFF; font-weight: bold; text-align: center; }
  td.oz { font-weight: bold; }
  td.od { text-align: center; color: #6B7280; }
  td.sk { font-weight: bold; font-size: 12pt; text-align: center; }
  td.n  { text-align: right; }
  td.tym { background: #EFEFEF; font-weight: bold; }
  td.cel { font-weight: bold; }
  td.alarm { background: #C0392B !important; color: #FFFFFF !important; font-weight: bold; }
  .chyba { padding: 24px; color: #991B1B; }
  .nacitam { padding: 24px; color: #6B7280; }
  dialog { border: 1px solid #D1D5DB; border-radius: 10px; max-width: 620px; padding: 20px 22px; color: #111827; }
  dialog h2 { margin: 0 0 10px; font-size: 13pt; color: #1F4E78; }
  dialog table { border-collapse: collapse; margin: 8px 0 12px; }
  dialog td { border: 1px solid #D1D5DB; padding: 4px 10px; }
  dialog p { line-height: 1.5; margin: 8px 0; }
  dialog .zavrit { float: right; font: inherit; border: 0; background: none; font-size: 16pt; cursor: pointer; color: #6B7280; }
  @media print { .lista button { display: none; } .lista { position: static; } }
</style>
</head>
<body>
<div class="lista">
  <h1>VÝKON OBCHODNÍKŮ</h1><span class="stav" id="stav">načítám…</span>
  <button type="button" id="info">ℹ Jak se počítá skóre</button>
</div>
<main id="obsah"><div class="nacitam">Načítám data…</div></main>
<dialog id="okno"><button class="zavrit" type="button" id="zavrit" aria-label="Zavřít">×</button><div id="oknoObsah"></div></dialog>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
