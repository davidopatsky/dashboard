<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">   <!-- stránka je tmavá sama; nepřebarvovat rozšířeními -->
<title>Výkon obchodníků</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap&subset=latin-ext" rel="stylesheet">
<style>html, body { margin: 0; background: #0F1729; color: #F3F6FB; font-family: Roboto, Arial, sans-serif; } body { visibility: hidden; }</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><h1>Výkon obchodníků</h1><div class="stav" id="stav">načítám data…</div></div>
  <nav class="tabs" aria-label="Záložky">
    <button type="button" data-tab="skore" aria-pressed="true">Skóre</button>
    <button type="button" data-tab="mesice" aria-pressed="false">Měsíční data</button>
    <button type="button" data-tab="leady" aria-pressed="false">Leady</button>
  </nav>
  <a class="sheet" id="sheet" hidden target="_blank" rel="noopener" title="Zdrojová data — Google Sheet" aria-label="Zdrojová data (Google Sheet)">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2" fill="#1FA463"/><path d="M7.5 9h9v8h-9z" fill="#fff"/><path d="M7.5 11.6h9M7.5 14.3h9M11 9v8" stroke="#1FA463" stroke-width="1.2"/></svg>
    <span>Zdrojová data</span></a>
  <button type="button" class="info" id="info" aria-label="Jak se počítá">ⓘ<span class="dlouhy"> Jak se počítá</span></button>
  <button type="button" class="odhlasit" id="odhlasit" hidden>Odhlásit</button>
</div>
  <nav class="subnav" id="subnav" aria-label="Tabulky" hidden></nav>
</header>
<main id="obsah"><div class="msg">Načítám data…</div></main>
<div id="tip" role="tooltip" hidden></div>
<dialog id="okno"><button class="x" type="button" id="zavrit" aria-label="Zavřít">×</button><div id="oknoObsah"></div></dialog>
<script>
// Vždy nejnovější verze: číslo verze se čte z version.json mimo mezipaměť a styly i skripty se načtou s ?v=<verze>.
// Tenhle soubor (index.html) se proto mění jen výjimečně; při každé změně app.js / app.css se zvýší verze ve version.json.
(function () {
  function nacti(v) {
    window.DASH_VERZE = v;
    var css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'app.css?v=' + encodeURIComponent(v);
    css.onload = css.onerror = function () { document.body.style.visibility = 'visible'; };
    document.head.appendChild(css);
    ['config.js', 'vypocet.js', 'app.js'].reduce(function (p, src) {
      return p.then(function () { return new Promise(function (ok, chyba) {
        var s = document.createElement('script'); s.src = src + '?v=' + encodeURIComponent(v); s.onload = ok; s.onerror = chyba;
        document.body.appendChild(s);
      }); });
    }, Promise.resolve());
  }
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (j) { nacti(String(j.verze)); }, function () { nacti(String(Date.now())); });
})();
</script>
</body>
</html>
